<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Property Intelligence</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #1a1a1a; background: #f6f7fb; }
    body { max-width: 820px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.5rem; }
    section { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.35rem; }
    input, textarea, button { font: inherit; }
    textarea { width: 100%; min-height: 72px; padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; }
    input[type=text] { width: 100%; padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; }
    button { margin-top: 0.75rem; background: #2563eb; color: #fff; border: 0; border-radius: 8px; padding: 0.55rem 1rem; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    pre { white-space: pre-wrap; word-break: break-word; background: #0f172a; color: #e2e8f0; padding: 1rem; border-radius: 8px; font-size: 0.9rem; }
    .hint { color: #64748b; font-size: 0.9rem; margin-top: 0.25rem; }
  </style>
</head>
<body>
  <h1>AI Property Intelligence</h1>
  <p class="hint">Learning MVP — hybrid SQL + Chroma matching</p>

  <section>
    <label for="query">Tìm phòng (natural language)</label>
    <textarea id="query" placeholder="Tìm trọ dưới 3.5 triệu gần Bách Khoa có sẵn bếp"></textarea>
    <button id="matchBtn" type="button">Match</button>
    <pre id="matchOut">Kết quả sẽ hiện ở đây...</pre>
  </section>

  <section>
    <label for="landmark">Báo cáo thị trường (chủ trọ) — landmark tùy chọn</label>
    <input id="landmark" type="text" placeholder="bach_khoa / dhbk / kim_lien (để trống = tất cả)" />
    <button id="marketBtn" type="button">Analyze</button>
    <pre id="marketOut">Báo cáo sẽ hiện ở đây...</pre>
  </section>

  <script>
    async function postJson(url, body) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || res.statusText);
      return data;
    }

    document.getElementById("matchBtn").addEventListener("click", async () => {
      const query = document.getElementById("query").value.trim();
      const out = document.getElementById("matchOut");
      const btn = document.getElementById("matchBtn");
      if (!query) { out.textContent = "Nhập query trước."; return; }
      btn.disabled = true;
      out.textContent = "Đang tìm...";
      try {
        const data = await postJson("/api/match", { query });
        out.textContent = data.answer;
      } catch (err) {
        out.textContent = "Lỗi: " + err.message;
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById("marketBtn").addEventListener("click", async () => {
      const landmark = document.getElementById("landmark").value.trim();
      const out = document.getElementById("marketOut");
      const btn = document.getElementById("marketBtn");
      btn.disabled = true;
      out.textContent = "Đang phân tích...";
      try {
        const url = landmark ? `/api/market?landmark=${encodeURIComponent(landmark)}` : "/api/market";
        const res = await fetch(url);
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || res.statusText);
        out.textContent = data.report_text;
      } catch (err) {
        out.textContent = "Lỗi: " + err.message;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
